name: Build OME Live original Java
on:
  push:
    branches: [main, original-java-test, java-diagnostics]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --console=plain 2>&1 | tee build-errors.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Build-Logs
          path: build-errors.txt
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: OME-Live-Original-Java-APK
          path: app/build/outputs/apk/debug/app-debug.apk
